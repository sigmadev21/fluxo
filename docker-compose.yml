# Manual alternative to the installer:
#   docker compose up -d --build        -> http://localhost:8080
#   FLUXO_PORT=3000 docker compose up -d --build
services:
  fluxo:
    build: .
    image: fluxo:latest
    container_name: fluxo
    restart: unless-stopped
    ports:
      - "${FLUXO_PORT:-8080}:80"
