<style>

<body>

<script>
"use strict";
/* ============ Utilitários ============ */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const brl=n=>n.toLocaleString(LOC[LANG],{style:"currency",currency:"BRL"});
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const fmtD=s=>s.split("-").reverse().join("/");
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36);
const MES=["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
const nxt=(s,f)=>{const d=new Date(s+"T12:00");f==="semanal"?d.setDate(d.getDate()+7):f==="mensal"?d.setMonth(d.getMonth()+1):d.setFullYear(d.getFullYear()+1);return iso(d)};
const LS={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{toast("Não foi possível salvar os dados","err")}},del(k){try{localStorage.removeItem(k)}catch{}}};
function toast(m,t=""){const e=document.createElement("div");e.className="ts "+t;e.textContent=m;$("#toasts").append(e);setTimeout(()=>{e.classList.add("out");setTimeout(()=>e.remove(),300)},3400)}
const openModal=h=>{closeModal();const m=document.createElement("div");m.className="mo";m.innerHTML=`<div class="g md" role="dialog" aria-modal="true">${h}</div>`;m.addEventListener("mousedown",e=>{if(e.target===m)closeModal()});document.body.append(m);m.querySelector("input:not([type=radio]),select")?.focus()};
const closeModal=()=>$(".mo")?.remove();
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});

/* ============ Dados ============ */
const DEF=[["Alimentação","🍔","d"],["Moradia","🏠","d"],["Transporte","🚗","d"],["Saúde","💊","d"],["Lazer","🎮","d"],["Educação","📚","d"],["Compras","🛍️","d"],["Contas","💡","d"],["Outros","📦","d"],["Salário","💼","r"],["Freelance","💻","r"],["Investimentos","📈","r"],["Outras receitas","💰","r"]].map(([n,e,t])=>({n,e,t}));
const PAL=["#6366f1","#ec4899","#f59e0b","#10b981","#06b6d4","#8b5cf6","#f43f5e","#84cc16","#64748b","#14b8a6","#f97316","#3b82f6","#a855f7"];
const PAY=["Pix","Cartão de crédito","Cartão de débito","Dinheiro","Boleto","Transferência"];
const REC={"":"Não repete",semanal:"Semanalmente",mensal:"Mensalmente",anual:"Anualmente"};
const S={user:null,data:null,wp:"",view:"painel",f:{from:"",to:"",q:"",cat:"",type:""}};
const CFG={accent:"indigo",custom:"#6366f1",wall:"aurora",anim:true};
const ACC={indigo:["#6366f1","#ec4899","Índigo"],oceano:["#0ea5e9","#6366f1","Oceano"],sol:["#f97316","#ec4899","Pôr do sol"],menta:["#10b981","#06b6d4","Menta"],violeta:["#8b5cf6","#d946ef","Violeta"],rubi:["#ef4444","#f59e0b","Rubi"]};
const WP={aurora:"radial-gradient(40% 40% at 20% 20%,color-mix(in srgb,var(--a1) 66%,transparent),transparent),radial-gradient(35% 35% at 80% 30%,color-mix(in srgb,var(--a2) 66%,transparent),transparent),radial-gradient(40% 40% at 50% 90%,#22d3eeaa,transparent)",oceano:"radial-gradient(50% 50% at 20% 20%,#38bdf8bb,transparent),radial-gradient(45% 45% at 80% 70%,#6366f1aa,transparent),radial-gradient(40% 40% at 50% 100%,#22d3eeaa,transparent)",sol:"radial-gradient(50% 50% at 80% 15%,#fb923ccc,transparent),radial-gradient(45% 45% at 15% 40%,#f472b6aa,transparent),radial-gradient(50% 50% at 60% 100%,#a78bfaaa,transparent)",floresta:"radial-gradient(50% 50% at 25% 20%,#34d399aa,transparent),radial-gradient(45% 45% at 80% 60%,#84cc16aa,transparent),radial-gradient(40% 40% at 40% 100%,#0d9488aa,transparent)",grafite:"radial-gradient(50% 50% at 30% 20%,#94a3b866,transparent),radial-gradient(50% 50% at 80% 80%,#64748b66,transparent)"};
const WPN={aurora:"Aurora",oceano:"Oceano",sol:"Pôr do sol",floresta:"Floresta",grafite:"Grafite"};
function applyCfg(){const c=S.data?.cfg||CFG,r=document.documentElement,cu=/^#[0-9a-f]{6}$/i.test(c.custom)?c.custom:"#6366f1",a=c.accent==="custom"?[cu,`color-mix(in srgb,${cu} 55%,#ec4899)`]:ACC[c.accent]||ACC.indigo,img=c.wall==="img"&&S.wp;
  r.dataset.anim=c.anim?"on":"off";r.dataset.wp=img?"img":"";
  r.style.setProperty("--a1",a[0]);r.style.setProperty("--a2",a[1]);
  r.style.setProperty("--wp",img?`url("${S.wp}") center/cover`:WP[c.wall]||WP.aurora)}
const ALL=()=>DEF.concat(S.data.cats);
const catOf=n=>ALL().find(c=>c.n===n)||{n,e:"🏷️"};
const col=n=>PAL[Math.max(0,ALL().findIndex(c=>c.n===n))%PAL.length];
const save=()=>LS.set("fx_data_"+S.user.id,S.data);

function runRec(){let n=0;const hoje=iso(new Date());
  S.data.tx.slice().forEach(t=>{if(!t.rec)return;let g=0;
    while(t.next&&t.next<=hoje&&g++<400){S.data.tx.push({...t,id:uid(),date:t.next,rec:"",next:"",auto:1});t.next=nxt(t.next,t.rec);n++}});
  if(n){save();toast(n+" transação(ões) recorrente(s) lançada(s)")}}

function filt(dash){const{from,to,q,cat,type}=S.f,k=q.trim().toLowerCase();
  return S.data.tx.filter(t=>(!from||t.date>=from)&&(!to||t.date<=to)&&(dash||((!cat||t.cat===cat)&&(!type||t.type===type)&&(!k||(t.desc+" "+t.cat+" "+t.pay+" "+(t.note||"")).toLowerCase().includes(k)))))
   .sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id))}

/* ============ Idiomas (padrão: inglês; textos-fonte em português) ============ */
const LANGS=["pt","en","es","fr"],LOC={pt:"pt-BR",en:"en-US",es:"es-ES",fr:"fr-FR"},LN={pt:"Português",en:"English",es:"Español",fr:"Français"};

function tr(s){if(LANG==="pt")return s;const i=LANGS.indexOf(LANG),m=s.match(/^(\s*)([\s\S]*?)(\s*)$/);if(!m[2])return s;
  const f=x=>{if(DX[x])return DX[x][i];for(const[r,a]of DP){const k=x.match(r);if(k){let n=0;return a[i].replace(/\{\}/g,()=>f(k[++n]))}}
    return x.includes(" · ")?x.split(" · ").map(f).join(" · "):x};
  return m[1]+f(m[2])+m[3]}
function tl(root){if(LANG==="pt"||!root)return;const skip="[translate=no],[data-n],textarea,script,style";
  if(root.nodeType===3){if(!root.parentElement?.closest(skip))root.nodeValue=tr(root.nodeValue);return}
  if(root.nodeType!==1)return;const w=document.createTreeWalker(root,5);let e=root;
  do{if(e.nodeType===3){if(!e.parentElement?.closest(skip))e.nodeValue=tr(e.nodeValue)}
    else{for(const a of["placeholder","title","aria-label"]){const v=e.getAttribute(a);if(v)e.setAttribute(a,tr(v))}
      if(e.tagName==="OPTION"&&!e.hasAttribute("value"))e.setAttribute("value",e.textContent)}}while(e=w.nextNode())}

/* ============ Autenticação ============ */
async function hash(pw,salt){const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
  const b=await crypto.subtle.deriveBits({name:"PBKDF2",salt:Uint8Array.from(atob(salt),c=>c.charCodeAt(0)),iterations:150000,hash:"SHA-256"},k,256);
  return btoa(String.fromCharCode(...new Uint8Array(b)))}
async function auth(mode,f){const v=Object.fromEntries(new FormData(f)),id=v.user.trim().toLowerCase(),U=LS.get("fx_users",{});
  try{
    if(mode==="reg"){
      if(!/^[a-z0-9_.-]{3,24}$/.test(id))return toast("Usuário: 3 a 24 caracteres (letras, números, _ . -)","err");
      if(v.pw.length<6)return toast("A senha precisa ter pelo menos 6 caracteres","err");
      if(v.pw!==v.pw2)return toast("As senhas não conferem","err");
      if(U[id])return toast("Esse nome de usuário já existe","err");
      const salt=btoa(String.fromCharCode(...crypto.getRandomValues(new Uint8Array(16))));
      U[id]={name:id,salt,hash:await hash(v.pw,salt)};LS.set("fx_users",U);
    }else{const u=U[id];if(!u||u.hash!==await hash(v.pw,u.salt))return toast("Usuário ou senha incorretos","err")}
    LS.set("fx_session",{id,exp:Date.now()+7*864e5});boot();toast(mode==="reg"?"Conta criada! Bem-vindo(a) 🎉":"Login realizado com sucesso")
  }catch{toast("Erro de autenticação. Tente novamente.","err")}}
function logout(){LS.del("fx_session");closeModal();authView();toast("Você saiu da conta. Até logo!")}
function authView(m="login"){S.user=S.data=null;applyCfg();const r=m==="reg";
  $("#app").innerHTML=`<div class="aw"><div class="g ab"><div class="logo">💧 <span>Fluxo</span></div><p class="mu">Seu controle de gastos pessoal</p>
  <div class="seg"><button type="button" class="${r?"":"on"}" data-act="am" data-m="login">Entrar</button><button type="button" class="${r?"on":""}" data-act="am" data-m="reg">Criar conta</button></div>
  <form id="af" data-m="${m}">
  <label>Usuário<input name="user" required minlength="3" maxlength="24" autocapitalize="none" autocomplete="username" spellcheck="false" placeholder="seu_usuario"></label>
  <label>Senha<input name="pw" type="password" required minlength="6" autocomplete="${r?"new-password":"current-password"}"></label>
  ${r?'<label>Confirmar senha<input name="pw2" type="password" required minlength="6" autocomplete="new-password"></label>':""}
  <button class="bt pr w">${r?"Criar minha conta":"Entrar"}</button></form>
  <label style="margin-top:14px">Idioma 🌐${langSel()}</label><p><small>🔒 Dados salvos apenas neste navegador, vinculados à sua conta. Senha protegida com hash PBKDF2.</small></p></div></div>`}
function boot(){const s=LS.get("fx_session"),sid=s&&(s.id||s.email),u=s&&s.exp>Date.now()&&LS.get("fx_users",{})[sid];
  if(!u){LS.del("fx_session");return authView()}
  LS.set("fx_session",{id:sid,exp:Date.now()+7*864e5});
  S.user={id:sid,name:u.name};S.data={tx:[],budgets:{},cats:[],...LS.get("fx_data_"+sid,{})};S.data.cfg={...CFG,...S.data.cfg};S.wp=LS.get("fx_wp_"+sid,"");applyCfg();
  const n=new Date();S.f={from:iso(new Date(n.getFullYear(),n.getMonth(),1)),to:iso(new Date(n.getFullYear(),n.getMonth()+1,0)),q:"",cat:"",type:""};
  S.view="painel";$("#app").innerHTML="";runRec();render()}

function donut(it,tot){const R=70,C=2*Math.PI*R;let off=0;
  return `<svg viewBox="0 0 200 200" class="donut" role="img" aria-label="Gastos por categoria"><circle cx="100" cy="100" r="${R}" fill="none" stroke="var(--tr)" stroke-width="26"/>`+
  it.map(([n,v])=>{const l=v/tot*C,s=`<circle cx="100" cy="100" r="${R}" fill="none" stroke="${col(n)}" stroke-width="26" stroke-dasharray="${Math.max(l-2,.5)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 100 100)"><title>${esc(n)}: ${brl(v)}</title></circle>`;off+=l;return s}).join("")+
  `<text x="100" y="96" text-anchor="middle" class="dt">Despesas</text><text x="100" y="117" text-anchor="middle" class="dv">${brl(tot)}</text></svg>`}
function bars(){const d=new Date(),ks=[];for(let i=5;i>=0;i--)ks.push(iso(new Date(d.getFullYear(),d.getMonth()-i,1)).slice(0,7));
  const ag=ks.map(k=>{let r=0,e=0;S.data.tx.forEach(t=>{if(t.date.slice(0,7)===k)t.type==="r"?r+=t.amount:e+=t.amount});return[k,r,e]});
  const mx=Math.max(1,...ag.flatMap(a=>[a[1],a[2]]));
  return `<div class="bars">`+ag.map(([k,r,e])=>`<div class="bc"><div class="bp"><i style="height:${r/mx*100}%;background:var(--ok)" title="Receitas ${brl(r)}"></i><i style="height:${e/mx*100}%;background:var(--no)" title="Despesas ${brl(e)}"></i></div><small>${MES[+k.slice(5)-1]}</small></div>`).join("")+`</div><small><span class="pos">■</span> Receitas &nbsp;<span class="neg">■</span> Despesas</small>`}

  const tot=S.data.tx.reduce((s,t)=>s+(t.type==="r"?t.amount:-t.amount),0),it=Object.entries(by).sort((x,y)=>y[1]-x[1]);
  return `<div><h1>Olá, ${esc(S.user.name)} 👋</h1><p class="mu">Resumo das suas finanças no período selecionado</p></div>${bar()}
  <div class="stats"><div class="g st big"><small>Saldo total</small><b class="${tot<0?"neg":""}" data-n="${tot}">${brl(tot)}</b></div><div class="g st"><small>Receitas do período</small><b class="pos" data-n="${r}">${brl(r)}</b></div><div class="g st"><small>Despesas do período</small><b class="neg" data-n="${e}">${brl(e)}</b></div></div>
  <div class="cols"><div class="g"><h3>Gastos por categoria</h3>${it.length?`<div class="dn">${donut(it,e)}<ul class="lg">${it.slice(0,7).map(([n,v])=>`<li><i style="background:${col(n)}"></i>${catOf(n).e} ${esc(n)}<b>${Math.round(v/e*100)}%</b></li>`).join("")}</ul></div>`:'<p class="emp">Sem despesas neste período</p>'}</div>
  <div class="g"><h3>Últimos 6 meses</h3>${bars()}</div></div>
  <div class="g"><div class="lh"><h3>Transações recentes</h3><button class="chip" data-act="nav" data-v="trans">Ver todas</button></div>${a.slice(0,5).map(row).join("")||'<p class="emp">Nada por aqui ainda. Toque no + para lançar sua primeira transação!</p>'}</div>`},
trans(){return `<h1>Transações</h1>${bar(1)}<div class="g"><div class="lh"><h3>Lançamentos</h3><small id="sum">${filt().length} resultado(s)</small></div><div id="lst">${list()}</div></div>`},
orc(){const m=iso(new Date()).slice(0,7),sp={};
  S.data.tx.forEach(t=>{if(t.type==="d"&&t.date.slice(0,7)===m)sp[t.cat]=(sp[t.cat]||0)+t.amount});
  return `<div><h1>Orçamentos</h1><p class="mu">Defina limites mensais por categoria (mês atual)</p>${(S.data.hid||[]).length?`<button class="chip" data-act="rshow" style="margin-top:8px">↺ Restaurar ocultos (${S.data.hid.length})</button>`:""}</div>
  <div class="g"><h3>Nova categoria personalizada</h3><form id="cf" class="two3" style="grid-template-columns:2fr 1fr 1fr auto"><input name="n" required maxlength="24" placeholder="Nome"><input name="e" maxlength="2" placeholder="Emoji 😀"><select name="t"><option value="d">Despesa</option><option value="r">Receita</option></select><button class="bt pr">Adicionar</button></form></div>
  <div class="bgrid">${ALL().filter(c=>c.t==="d"&&!(S.data.hid||[]).includes(c.n)).map(c=>{const l=S.data.budgets[c.n]||0,s=sp[c.n]||0,p=l?s/l*100:0;
   return `<div class="g"><div class="bh"><span class="ic" style="background:${col(c.n)}28">${c.e}</span><b>${esc(c.n)}</b><input type="number" min="0" step="10" placeholder="Limite R$" value="${l||""}" data-bud="${esc(c.n)}" aria-label="Limite de ${esc(c.n)}"><button class="chip" data-act="rmbud" data-c="${esc(c.n)}" title="Remover da tela" aria-label="Remover ${esc(c.n)} da tela">🗑️</button></div>
   ${l?`<div class="pb"><i style="width:${Math.min(p,100)}%;background:${p>=100?"var(--no)":p>=80?"#f59e0b":"var(--ok)"}"></i></div><small>${brl(s)} de ${brl(l)} · ${Math.round(p)}%${p>=100?" ⚠️ estourado":p>=80?" · atenção":""}</small>`:`<small>Gasto no mês: ${brl(s)} · sem limite</small>`}</div>`}).join("")}</div>`}};
V.cfg=()=>{const c=S.data.cfg,on=v=>v?"on":"";
  return `<div><h1>Ajustes ⚙️</h1><p class="mu">Deixe o app com a sua cara</p></div><div class="cfg">
  
  <div class="g"><h3>Idioma 🌐</h3>${langSel()}</div>
  <div class="g"><h3>Cor-tema</h3><div class="sw">${Object.entries(ACC).map(([k,a])=>`<button class="${on(c.accent===k)}" title="${a[2]}" aria-label="${a[2]}" style="background:linear-gradient(135deg,${a[0]},${a[1]})" data-act="cfg" data-k="accent" data-v="${k}"></button>`).join("")}<input type="color" data-cfg="custom" value="${c.custom}" title="Cor personalizada" aria-label="Cor personalizada"></div></div>
  <div class="g"><h3>Papel de parede</h3><div class="wps">${Object.keys(WP).map(k=>`<button class="${on(c.wall===k)}" style="background:${WP[k]},light-dark(#e9edff,#0b0d1f)" data-act="cfg" data-k="wall" data-v="${k}">${WPN[k]}</button>`).join("")}${S.wp?`<button class="${on(c.wall==="img")}" style="background:url('${S.wp}') center/cover" data-act="cfg" data-k="wall" data-v="img">Minha imagem</button>`:""}</div>
  <div class="chips"><label class="chip" style="cursor:pointer">📷 Enviar imagem<input type="file" accept="image/*" data-wpfile hidden></label>${S.wp?'<button class="chip" data-act="wpdel">Remover imagem</button>':""}</div></div>
  <div class="g"><h3>Efeitos</h3><label class="tg">Animações<input type="checkbox" data-cfg="anim" ${c.anim?"checked":""}></label></div>
  <button class="bt" data-act="cfgreset">↺ Restaurar padrão</button><button class="bt dg" data-act="delacc">🗑️ Excluir minha conta</button></div>`};
function setCfg(k,v){S.data.cfg[k]=v;save();applyCfg();render()}
function loadWp(file){if(!file)return;const rd=new FileReader(),im=new Image();
  rd.onload=()=>{im.src=rd.result};rd.onerror=im.onerror=()=>toast("Não foi possível ler a imagem","err");
  im.onload=()=>{const k=Math.min(1,1600/Math.max(im.width,im.height)),cv=document.createElement("canvas");cv.width=im.width*k;cv.height=im.height*k;cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);
    S.wp=cv.toDataURL("image/jpeg",.8);LS.set("fx_wp_"+S.user.id,S.wp);S.data.cfg.wall="img";save();applyCfg();render();toast("Papel de parede atualizado 🖼️")};
  rd.readAsDataURL(file)}
function stag(){document.querySelectorAll(".row").forEach((r,i)=>r.style.animationDelay=Math.min(i,12)*25+"ms")}
function post(){[...$("#main").children].forEach((c,i)=>c.style.animationDelay=i*50+"ms");stag();
  if(S.data.cfg.anim)document.querySelectorAll("[data-n]").forEach(el=>{const n=+el.dataset.n,t0=performance.now();(function f(t){const p=Math.min((t-t0)/650,1);el.textContent=brl(n*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)})(t0)})}
async function delAccount(f){const U=LS.get("fx_users",{}),id=S.user.id,u=U[id];
  try{if(!u||u.hash!==await hash(new FormData(f).get("pw"),u.salt))return toast("Senha incorreta","err");
    delete U[id];LS.set("fx_users",U);LS.del("fx_data_"+id);LS.del("fx_wp_"+id);LS.del("fx_session");closeModal();authView();toast("Conta excluída com sucesso 🗑️")}
  catch{toast("Erro ao excluir a conta","err")}}
function render(){if(!S.user)return;
  if(!$("#main"))$("#app").innerHTML=`<div class="shell"><nav class="g nav"><div class="logo">💧 <span>Fluxo</span></div>${[["painel","📊","Painel"],["trans","💸","Transações"],["orc","🎯","Orçamentos"],["cfg","⚙️","Ajustes"]].map(([v,i,l])=>`<button class="ni" data-act="nav" data-v="${v}"><span>${i}</span><em>${l}</em></button>`).join("")}<button class="ni out" data-act="out"><span>🚪</span><em>Sair</em></button></nav><main id="main"></main></div><button class="fab" data-act="add" aria-label="Nova transação">+</button>`;
  document.querySelectorAll(".ni[data-v]").forEach(b=>b.classList.toggle("on",b.dataset.v===S.view));
  $("#main").innerHTML=V[S.view]();post()}

/* ============ Transações ============ */
function txForm(id){const t=S.data.tx.find(x=>x.id===id)||{type:"d",date:iso(new Date()),pay:PAY[0],rec:""};
  openModal(`<h2>${id?"Editar":"Nova"} transação</h2><form id="tf"><div class="seg"><label><input type="radio" name="type" value="d" ${t.type==="d"?"checked":""}><span>Despesa</span></label><label><input type="radio" name="type" value="r" ${t.type==="r"?"checked":""}><span>Receita</span></label></div>
  <label>Descrição<input name="desc" required maxlength="60" value="${esc(t.desc)}"></label>
  <div class="two"><label>Valor (R$)<input name="amount" type="number" step="0.01" min="0.01" required inputmode="decimal" value="${t.amount??""}"></label><label>Data<input name="date" type="date" required value="${t.date}"></label></div>
  <label>Categoria<select name="cat"></select></label>
  <div class="two"><label>Pagamento<select name="pay">${PAY.map(p=>`<option ${p===t.pay?"selected":""}>${p}</option>`).join("")}</select></label><label>Recorrência<select name="rec">${Object.entries(REC).map(([k,v])=>`<option value="${k}" ${k===t.rec?"selected":""}>${v}</option>`).join("")}</select></label></div>
  <label>Observações<textarea name="note" rows="2" maxlength="200">${esc(t.note)}</textarea></label>
  <div class="acts"><button type="button" class="bt" data-act="close">Cancelar</button><button class="bt pr">Salvar</button></div></form>`);
  const f=$("#tf"),fc=()=>{f.cat.innerHTML=ALL().filter(c=>c.t===f.type.value).map(c=>`<option ${c.n===t.cat?"selected":""}>${esc(c.n)}</option>`).join("")};
  fc();f.querySelectorAll("[name=type]").forEach(r=>r.onchange=()=>{t.cat="";fc()});
  f.onsubmit=e=>{e.preventDefault();const v=Object.fromEntries(new FormData(f)),amount=Math.round(parseFloat(v.amount)*100)/100;
    if(!(amount>0)||!v.desc.trim())return toast("Informe uma descrição e um valor válidos","err");
    const o={id:id||uid(),type:v.type,desc:v.desc.trim(),amount,date:v.date,cat:v.cat,pay:v.pay,note:v.note.trim(),rec:v.rec,next:v.rec?(t.rec===v.rec&&t.next?t.next:nxt(v.date,v.rec)):"",auto:t.auto};
    id?Object.assign(S.data.tx.find(x=>x.id===id),o):S.data.tx.push(o);
    save();closeModal();runRec();render();toast(id?"Transação atualizada ✏️":"Transação adicionada ✅");budgetWarn(o)}}
function budgetWarn(o){const l=S.data.budgets[o.cat];if(o.type!=="d"||!l)return;
  const s=S.data.tx.filter(t=>t.type==="d"&&t.cat===o.cat&&t.date.slice(0,7)===o.date.slice(0,7)).reduce((a,t)=>a+t.amount,0);
  if(s>=l)toast(`⚠️ Orçamento de ${o.cat} estourado (${brl(s)} de ${brl(l)})`,"wr");else if(s>=l*.8)toast(`Atenção: ${Math.round(s/l*100)}% do orçamento de ${o.cat}`,"wr")}
function confirmDel(id){const t=S.data.tx.find(x=>x.id===id);if(!t)return;
  openModal(`<h2>Excluir transação?</h2><p class="mu">${esc(t.desc)} · ${brl(t.amount)}${t.rec?"<br>Os próximos lançamentos recorrentes também serão cancelados.":""}</p><div class="acts"><button class="bt" data-act="close">Cancelar</button><button class="bt dg" data-act="ok" data-id="${id}">Excluir</button></div>`)}
function preset(p){const n=new Date(),y=n.getFullYear(),m=n.getMonth();
  const r={mes:[new Date(y,m,1),new Date(y,m+1,0)],ant:[new Date(y,m-1,1),new Date(y,m,0)],30:[new Date(Date.now()-29*864e5),n],ano:[new Date(y,0,1),new Date(y,11,31)]}[p];
  S.f.from=r?iso(r[0]):"";S.f.to=r?iso(r[1]):"";render()}

/* ============ Eventos (delegação) ============ */
document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b)return;const{act,id}=b.dataset;
  ({nav:()=>{S.view=b.dataset.v;render();scrollTo({top:0,behavior:"smooth"})},add:()=>txForm(),edit:()=>txForm(id),del:()=>confirmDel(id),close:closeModal,out:logout,preset:()=>preset(b.dataset.p),am:()=>authView(b.dataset.m),delacc:()=>openModal(`<h2>Excluir conta?</h2><p class="mu">Isso apaga o usuário <b>${esc(S.user.name)}</b> e todas as transações, orçamentos e ajustes. Não dá pra desfazer.</p><form id="df"><label>Confirme sua senha<input name="pw" type="password" required autocomplete="current-password"></label><div class="acts"><button type="button" class="bt" data-act="close">Cancelar</button><button class="bt dg">Excluir de vez</button></div></form>`),rmbud:()=>{const n=b.dataset.c;delete S.data.budgets[n];S.data.hid=[...(S.data.hid||[]),n];save();render();toast("Orçamento removido da tela 🗑️")},rshow:()=>{S.data.hid=[];save();render();toast("Orçamentos restaurados ↺")},cfg:()=>setCfg(b.dataset.k,b.dataset.v),cfgreset:()=>{S.data.cfg={...CFG};save();applyCfg();render();toast("Ajustes restaurados ↺")},wpdel:()=>{S.wp="";LS.del("fx_wp_"+S.user.id);if(S.data.cfg.wall==="img")S.data.cfg.wall="aurora";save();applyCfg();render()},
   ok:()=>{S.data.tx=S.data.tx.filter(t=>t.id!==id);save();closeModal();render();toast("Transação excluída 🗑️")}})[act]?.()});
document.addEventListener("input",e=>{const t=e.target,k=t.dataset.cfg;if(k==="custom"){const c=S.data.cfg;c.custom=t.value;c.accent="custom";applyCfg()}
  if(e.target.dataset.f==="q"){S.f.q=e.target.value;const a=filt();$("#lst").innerHTML=list();stag();$("#sum").textContent=a.length+" resultado(s)"}});
document.addEventListener("change",e=>{const t=e.target;
  if(t.dataset.f&&t.dataset.f!=="q"){S.f[t.dataset.f]=t.value;render()}
  else if("lang" in t.dataset){setLang(t.value)}
  else if("wpfile" in t.dataset){loadWp(t.files[0]);t.value=""}
  else if(t.dataset.cfg){const k=t.dataset.cfg,c=S.data.cfg;c[k]=t.type==="checkbox"?t.checked:t.value;if(k==="custom")c.accent="custom";save();applyCfg();render()}
  else if(t.dataset.bud){const v=parseFloat(t.value);v>0?S.data.budgets[t.dataset.bud]=v:delete S.data.budgets[t.dataset.bud];save();render();toast("Orçamento atualizado 🎯")}});
document.addEventListener("submit",e=>{const f=e.target;
  if(f.id==="af"){e.preventDefault();auth(f.dataset.m,f)}
  else if(f.id==="df"){e.preventDefault();delAccount(f)}
  else if(f.id==="cf"){e.preventDefault();const v=Object.fromEntries(new FormData(f)),n=v.n.trim();
    if(ALL().some(c=>c.n.toLowerCase()===n.toLowerCase()))return toast("Essa categoria já existe","err");
    S.data.cats.push({n,e:v.e.trim()||"🏷️",t:v.t});save();render();toast("Categoria criada ✨")}});
new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(tl))).observe(document.body,{childList:true,subtree:true});
document.documentElement.lang=LANG;document.title="Fluxo — "+tr("Controle de gastos");
document.addEventListener("visibilitychange",()=>document.documentElement.classList.toggle("pz",document.hidden));
boot();
</script>
</body>
</html>
